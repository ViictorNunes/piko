name: Build MPP Patch

on:
  workflow_dispatch: # Permite executar manualmente a qualquer momento

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Dar permissao de execucao
        run: chmod +x gradlew

      - name: Compilar arquivo .mpp
        run: ./gradlew :patches:buildAndroid

      - name: Disponibilizar o .mpp em Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: piko-patch-mpp
          path: patches/build/libs/*.mpp

